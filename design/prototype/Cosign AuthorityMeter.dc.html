<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:10px;width:100%">
  <span style="font-size:14px;font-weight:600">{{ title }}</span>
  <div style="display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;overflow:hidden">
    <sc-for list="{{ items }}" as="r" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--surface)">
        <span style="width:14px;height:14px;flex:none;display:flex;color:{{ r.color }}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ r.icon }}"></path></svg>
        </span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <code style="font:500 12px var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.cap }}</code>
          <sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--muted)">{{ r.sub }}</span></sc-if>
        </div>
        <sc-if value="{{ r.isPending }}" hint-placeholder-val="{{ false }}"><dc-import name="QuorumSeal" required="{{ 2 }}" approvals="{{ r.seal }}" size="{{ 26 }}" hint-size="26px,26px"></dc-import></sc-if>
        <sc-if value="{{ r.isGranted }}" hint-placeholder-val="{{ false }}">
          <span style="height:22px;padding:0 8px;border-radius:4px;background:{{ r.pillBg }};color:{{ r.pillFg }};font:500 12px/22px var(--font);white-space:nowrap;flex:none">{{ r.note }} left</span>
        </sc-if>
        <sc-if value="{{ r.showLabel }}" hint-placeholder-val="{{ true }}"><span style="font:500 12px var(--font);color:{{ r.color }}">{{ r.label }}</span></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:320},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{cap,state,note,seal}[]&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Current authority&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const I = { ok: 'M3 8.5l3 3 7-7', locked: 'M4.5 7.5h7v6h-7zM6 7.5V5.5a2 2 0 0 1 4 0v2', pending: 'M8 3v5l3 2M8 14.5a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z', granted: 'M8 4.5V8l2.5 1.5M8 14a6 6 0 1 1 0-12 6 6 0 0 1 0 12z' };
    const C = { ok: 'var(--ok)', locked: 'var(--muted)', pending: 'var(--pending)', granted: 'var(--text)' };
    const L = { ok: 'Allowed', locked: 'Locked', pending: 'Pending', granted: '' };
    const items = (this.props.rows || []).map(r => {
      const parts = (r.note || '').split(':').map(Number);
      const secs = parts.length === 2 ? parts[0] * 60 + parts[1] : 999;
      const amber = secs < 300;
      return {
        cap: r.cap, color: C[r.state], icon: I[r.state], label: L[r.state], showLabel: r.state !== 'granted',
        hasSub: r.state === 'pending' || (r.state === 'locked' && !!r.note) || r.state === 'granted',
        sub: r.state === 'granted' ? 'Access expires in ' + r.note : r.note,
        isPending: r.state === 'pending', isGranted: r.state === 'granted', note: r.note, seal: r.seal || [],
        pillBg: amber ? 'color-mix(in oklch, var(--pending) 14%, transparent)' : 'var(--surface2)', pillFg: amber ? 'var(--pending)' : 'var(--text)',
      };
    });
    return { items, title: this.props.title || 'Current authority' };
  }
}
</script>
</body>
</html>
