<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:center;gap:{{ gap }};min-width:0">
  <sc-if value="{{ isAgent }}" hint-placeholder-val="{{ false }}">
    <div style="width:{{ av }};height:{{ av }};flex:none;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:var(--agent);color:#160C2B;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:{{ fs }}">{{ initials }}</div>
  </sc-if>
  <sc-if value="{{ isHuman }}" hint-placeholder-val="{{ true }}">
    <div style="width:{{ av }};height:{{ av }};flex:none;border-radius:50%;background:{{ color }};color:#0B0D12;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:{{ fs }}">{{ initials }}</div>
  </sc-if>
  <sc-if value="{{ showText }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;min-width:0;line-height:1.25">
      <span style="font-size:{{ nameFs }};font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ name }}</span>
      <sc-if value="{{ showSub }}" hint-placeholder-val="{{ false }}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sub }}</span>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:60},&quot;person&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Person&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;xs&quot;,&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;role&quot;,&quot;handle&quot;],&quot;default&quot;:&quot;role&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatarOnly&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.person || { name: '—', initials: '?', color: '#8A92A3' };
    const size = this.props.size || 'md';
    const px = { xs: 20, sm: 26, md: 32, lg: 44 }[size] || 32;
    const sub = this.props.sub === 'handle' ? p.handle : this.props.sub === 'role' ? p.role : '';
    return {
      isAgent: !!p.agent, isHuman: !p.agent, initials: p.initials, color: p.color, name: p.name,
      av: px + 'px', fs: Math.round(px * 0.36) + 'px', gap: px < 26 ? '6px' : '10px', nameFs: px >= 44 ? '15px' : px <= 20 ? '12px' : '13px',
      showText: !this.props.avatarOnly, showSub: !!sub, sub,
    };
  }
}
</script>
</body>
</html>
